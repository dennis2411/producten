<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn producten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2430;--mute:#5d6b7a;--line:#d5dbe2;--acc:#2547d0;--accink:#fff;--ph:#dfe5eb}
@media(prefers-color-scheme:dark){:root{--bg:#141a21;--card:#1e262f;--ink:#e8edf2;--mute:#9aa8b6;--line:#303a45;--acc:#7b94ff;--accink:#10162b;--ph:#2a343f}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0;max-width:1100px;margin:0 auto}
h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
nav{display:flex;gap:8px;padding:16px 20px;max-width:1100px;margin:0 auto}
nav button{font:inherit;font-weight:600;padding:9px 20px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
nav button[aria-current=true]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.link{background:none;border:0;font:inherit;color:var(--mute);cursor:pointer;text-decoration:underline;padding:4px}
main{max-width:1100px;margin:0 auto;padding:0 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column}
.card:hover{border-color:var(--acc)}
.pic{aspect-ratio:1/1;background:var(--ph);display:grid;place-items:center;color:var(--mute);font-size:.85rem}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:12px 14px 14px}
.info b{display:block;font-weight:600}
.art{color:var(--mute);font-size:.85rem}
.price{font-weight:800;font-size:1.15rem;margin-top:6px}
.empty{color:var(--mute);padding:40px 0}
.bar{display:flex;justify-content:flex-end;margin-bottom:14px}
.btn{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:1.5px solid var(--acc);background:var(--acc);color:var(--accink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.danger{border-color:#c0392b;color:#c0392b;background:transparent}
dialog{border:0;border-radius:14px;padding:0;max-width:min(520px,94vw);width:100%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,20,.55)}
.dlg{padding:20px;display:grid;gap:12px}
.dlg .pic{border-radius:10px;overflow:hidden}
.dlg h2{margin:0;font-size:1.4rem}
.dims{background:var(--bg);border-radius:8px;padding:12px 14px;white-space:pre-line}
.dims small{display:block;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
input,textarea,select{font:inherit;padding:9px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.msg{color:#c0392b;font-size:.9rem;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;display:none}
</style>
</head>
<body>
<header>
  <h1>Mijn producten</h1>
  <button class="link" id="adminBtn">Beheer</button>
</header>
<nav>
  <button data-cat="producten">Producten</button>
  <button data-cat="set">Set</button>
</nav>
<main>
  <div class="bar" id="bar" hidden><button class="btn" id="addBtn">Nieuw toevoegen</button></div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="detail"><div class="dlg" id="detailBody"></div></dialog>

<dialog id="login"><form class="dlg" id="loginForm" method="dialog">
  <h2>Beheer</h2>
  <label>Jouw code<input type="password" id="token" inputmode="numeric" autocomplete="off" required></label>
  <div class="msg" id="loginMsg"></div>
  <div class="row"><button type="button" class="btn ghost" id="loginCancel">Annuleren</button><button class="btn">Inloggen</button></div>
</form></dialog>

<dialog id="setup"><form class="dlg" id="setupForm" method="dialog">
  <h2>Eenmalig instellen</h2>
  <label>Repository (gebruiker/naam)<input id="sRepo" required></label>
  <label>GitHub-sleutel (github_pat_...)<input id="sTok" type="password" autocomplete="off" required></label>
  <label>Naam 1<input id="sN1" value="Dennis" required></label>
  <label>Code 1<input id="sC1" value="2424" required></label>
  <label>Naam 2<input id="sN2" value="Tessa" required></label>
  <label>Code 2<input id="sC2" value="1515" required></label>
  <textarea id="sOut" rows="4" readonly hidden></textarea>
  <div class="msg" id="sMsg"></div>
  <div class="row"><button type="button" class="btn ghost" id="sClose">Sluiten</button><button class="btn" id="sGo">Maak config.json</button><button type="button" class="btn" id="sDl" hidden>Download config.json</button></div>
</form></dialog>
<dialog id="edit"><form class="dlg" id="editForm" method="dialog">
  <h2 id="editTitle">Product</h2>
  <label>Naam<input id="fNaam" required></label>
  <label>Pagina<select id="fCat"><option value="producten">Producten</option><option value="set">Set</option></select></label>
  <label>Artikelnummer<input id="fArt" required></label>
  <label>Prijs (bijv. 12,50)<input id="fPrijs" required></label>
  <label>Afmetingen<textarea id="fDim" rows="3" placeholder="Bijv. 30 x 20 x 10 cm"></textarea></label>
  <label>Foto<input type="file" id="fFoto" accept="image/*"></label>
  <div class="msg" id="editMsg"></div>
  <div class="row"><button type="button" class="btn ghost" id="editCancel">Annuleren</button><button class="btn" id="saveBtn">Opslaan</button></div>
</form></dialog>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let items=[], cat=(location.hash==='#set'?'set':'producten'), editing=null;
let token=null, repo=null, who=null;
try{token=sessionStorage.getItem('tok');repo=sessionStorage.getItem('repo');who=sessionStorage.getItem('who')}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const euro=p=>{const t=String(p).trim();return /^[€\d]/.test(t)&&!t.startsWith('€')?'€ '+t:t};
const guessRepo=()=>{const h=location.hostname,p=location.pathname.split('/')[1];return h.endsWith('github.io')?h.split('.')[0]+'/'+(p||h):''};
const isAdmin=()=>!!(token&&repo);

async function load(){
  try{const r=await fetch('products.json?'+Date.now());items=await r.json()}
  catch(e){items=[]}
  render();
}
function pic(it){return it.foto?`<img src="${esc(it.foto)}" alt="${esc(it.naam)}" loading="lazy">`:'Geen foto'}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.cat===cat));
  $('#bar').hidden=!isAdmin();
  $('#adminBtn').textContent=isAdmin()?'Uitloggen ('+(who||'')+')':'Beheer';
  const list=items.filter(i=>i.cat===cat);
  $('#grid').innerHTML=list.length?list.map(i=>`<button class="card" data-id="${esc(i.id)}"><div class="pic">${pic(i)}</div><div class="info"><b>${esc(i.naam)}</b><span class="art">Art.nr. ${esc(i.artnr)}</span><div class="price">${esc(euro(i.prijs))}</div></div></button>`).join(''):'<p class="empty">Nog niets op deze pagina.</p>';
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;try{history.replaceState(null,'','#'+cat)}catch(x){}render()});
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)openDetail(c.dataset.id)};

function openDetail(id){
  const i=items.find(x=>x.id===id);if(!i)return;
  $('#detailBody').innerHTML=`<div class="pic">${pic(i)}</div><h2>${esc(i.naam)}</h2>
  <div><span class="art">Artikelnummer ${esc(i.artnr)}</span><div class="price">${esc(euro(i.prijs))}</div></div>
  <div class="dims"><small>Afmetingen</small>${esc(i.afmetingen||'Niet opgegeven')}</div>
  <div class="row">${isAdmin()?`<button class="btn danger" id="delBtn">Verwijderen</button><button class="btn ghost" id="editBtn">Bewerken</button>`:''}<button class="btn" id="closeBtn">Sluiten</button></div>`;
  $('#closeBtn').onclick=()=>$('#detail').close();
  if(isAdmin()){
    $('#editBtn').onclick=()=>{$('#detail').close();openEdit(i)};
    $('#delBtn').onclick=async()=>{if(!confirm('Dit product verwijderen?'))return;
      try{await commit(items.filter(x=>x.id!==i.id),'Verwijder '+i.naam);$('#detail').close()}catch(e){alert(e.message)}};
  }
  $('#detail').showModal();
}

/* Beheer */
$('#adminBtn').onclick=()=>{
  if(isAdmin()){token=repo=who=null;try{sessionStorage.clear()}catch(e){}render();return}
  $('#loginMsg').textContent='';$('#login').showModal();
};
$('#loginCancel').onclick=()=>$('#login').close();
const enc=new TextEncoder(),dec=new TextDecoder();
const b2a=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const a2b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFor(code,salt){const m=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(code,text){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await keyFor(code,salt),enc.encode(text));return{salt:b2a(salt),iv:b2a(iv),data:b2a(ct)}}
async function unseal(code,u){try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:a2b(u.iv)},await keyFor(code,a2b(u.salt)),a2b(u.data));return dec.decode(pt)}catch(e){return null}}

$('#loginForm').onsubmit=async e=>{
  e.preventDefault();
  const code=$('#token').value.trim();
  $('#loginMsg').textContent='Controleren...';
  let cfg;
  try{const r=await fetch('config.json?'+Date.now());if(!r.ok)throw 0;cfg=await r.json()}
  catch(x){$('#loginMsg').textContent='Beheer is nog niet ingesteld.';return}
  for(const u of cfg.users){
    const t=await unseal(code,u);
    if(t){token=t;repo=cfg.repo;who=u.naam;
      try{sessionStorage.setItem('tok',t);sessionStorage.setItem('repo',repo);sessionStorage.setItem('who',who)}catch(x){}
      $('#token').value='';$('#login').close();render();return}
  }
  $('#loginMsg').textContent='Code klopt niet.';
};

/* Eenmalig instellen: open de site met #setup achter het adres */
function openSetup(){$('#sRepo').value=guessRepo();$('#sOut').hidden=true;$('#sDl').hidden=true;$('#sMsg').textContent='';$('#setup').showModal()}
$('#sClose').onclick=()=>$('#setup').close();
$('#setupForm').onsubmit=async e=>{
  e.preventDefault();$('#sMsg').textContent='Bezig...';
  const mk=async(n,c)=>({naam:n,...await seal(c,$('#sTok').value.trim())});
  const cfg={repo:$('#sRepo').value.trim(),users:[await mk($('#sN1').value.trim(),$('#sC1').value.trim()),await mk($('#sN2').value.trim(),$('#sC2').value.trim())]};
  const txt=JSON.stringify(cfg,null,2);
  $('#sOut').value=txt;$('#sOut').hidden=false;$('#sDl').hidden=false;
  $('#sMsg').style.color='inherit';$('#sMsg').textContent='Klaar. Download het bestand en upload het in je repository.';
  $('#sDl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='config.json';a.click()};
};
if(location.hash==='#setup')openSetup();

function openEdit(i){
  editing=i;$('#editTitle').textContent=i?'Product bewerken':'Nieuw toevoegen';
  $('#fNaam').value=i?.naam||'';$('#fCat').value=i?.cat||cat;$('#fArt').value=i?.artnr||'';
  $('#fPrijs').value=i?.prijs||'';$('#fDim').value=i?.afmetingen||'';$('#fFoto').value='';$('#editMsg').textContent='';
  $('#edit').showModal();
}
$('#addBtn').onclick=()=>openEdit(null);
$('#editCancel').onclick=()=>$('#edit').close();
$('#editForm').onsubmit=async e=>{
  e.preventDefault();
  $('#saveBtn').disabled=true;$('#editMsg').textContent='Opslaan...';
  try{
    let foto=editing?.foto||'';
    const f=$('#fFoto').files[0];
    if(f){const path='fotos/'+Date.now()+'.jpg';await putFile(path,await shrink(f),'Foto '+$('#fNaam').value);foto=path}
    const it={id:editing?.id||('p'+Date.now()),cat:$('#fCat').value,naam:$('#fNaam').value.trim(),artnr:$('#fArt').value.trim(),prijs:$('#fPrijs').value.trim(),afmetingen:$('#fDim').value.trim(),foto};
    const next=editing?items.map(x=>x.id===it.id?it:x):[...items,it];
    await commit(next,(editing?'Wijzig ':'Voeg toe ')+it.naam);
    cat=it.cat;try{history.replaceState(null,'','#'+cat)}catch(x){}render();
    $('#edit').close();
  }catch(err){$('#editMsg').textContent=err.message||'Opslaan mislukt.'}
  $('#saveBtn').disabled=false;
};

/* GitHub API */
const api=p=>`https://api.github.com/repos/${repo}/contents/${p}`;
const H=()=>({Authorization:'Bearer '+token,Accept:'application/vnd.github+json'});
async function putFile(path,b64,message){
  let sha;
  const g=await fetch(api(path),{headers:H()});
  if(g.ok)sha=(await g.json()).sha;
  const r=await fetch(api(path),{method:'PUT',headers:H(),body:JSON.stringify({message,content:b64,sha})});
  if(!r.ok)throw new Error('GitHub weigerde de opslag ('+r.status+'). Controleer de rechten van je code.');
}
async function commit(next,message){
  await putFile('products.json',btoa(unescape(encodeURIComponent(JSON.stringify(next,null,2)))),message);
  items=next;render();
  const t=$('#toast');t.textContent='Opgeslagen. Op de site kan het even duren voordat het zichtbaar is.';t.style.display='block';setTimeout(()=>t.style.display='none',4000);
}
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,1000/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.82).split(',')[1]);URL.revokeObjectURL(u)};
    img.onerror=()=>rej(new Error('Foto kon niet gelezen worden.'));
    img.src=u;
  });
}
load();
</script>
</body>
</html>
